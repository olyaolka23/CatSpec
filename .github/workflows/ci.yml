name: CI

# Every pull request and every push to main runs on Linux (Node 22 and 24).
# macOS and Windows run only when the pull request has the label `full-ci-mac` or `full-ci-win`;
# adding the label starts a new run that includes them.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    # Adding an unrelated label doesn't start a new run.
    if: ${{ github.event.action != 'labeled' || startsWith(github.event.label.name, 'full-ci-') }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.os }}-${{ matrix.node }}
      # Superseded PR runs are cancelled; every push to main keeps its own result.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(format('["ubuntu-latest"{0}{1}]',
            contains(github.event.pull_request.labels.*.name, 'full-ci-mac') && ',"macos-latest"' || '',
            contains(github.event.pull_request.labels.*.name, 'full-ci-win') && ',"windows-latest"' || '')) }}
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint (warnings fail)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # CatSpec checks its own repository: the ADR log's rules (PBI `dogfood-specs`).
      - name: CatSpec check
        run: node packages/cli/dist/bin.js check
      - name: Acceptance coverage
        if: ${{ !cancelled() }}
        run: npm run check:acceptance
