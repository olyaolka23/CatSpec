name: Release

# Publishes the packages to npm (PBI `release-packaging`). Started by hand only, after the version
# PR (`npx changeset version`) is merged. The owner runs the acceptance sweep before starting it
# (`npm test`, `npm run bench`, `npm run check:acceptance -- --all`): this workflow runs no tests,
# to save Actions minutes. The `npm-release` environment needs the owner's approval before
# anything is published (AGENTS.md Rule 3).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - run: git push --follow-tags
